<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Security: Content Security Policy -->
    <!-- script-src 'self' only — no inline scripts needed (routing moved to external file) -->
    <!-- style-src 'unsafe-inline' required for React's inline style props -->
    <!-- connect-src 'none' — this site makes zero network requests -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <!-- Security: don't leak the full URL as referrer to any third parties -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/Concepts-of-AI/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concepts of AI</title>
    <!-- GitHub Pages SPA routing redirect (external to satisfy CSP script-src 'self') -->
    <script src="/Concepts-of-AI/spa-redirect.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
