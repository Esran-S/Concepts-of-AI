<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Redirecting…</title>
  <script>
    (function () {
      var BASE = '/Concepts-of-AI';
      var path = window.location.pathname;
      var query = window.location.search;

      // Only redirect if this is a legitimate sub-path of the repo base.
      // This prevents the 404 handler being used as an open redirector
      // via crafted URLs like /../../../evil.com.
      if (typeof path === 'string'
          && (path === BASE || path.indexOf(BASE + '/') === 0)
          && !/\.\./.test(path)
          && !/\x00|%00/i.test(path)) {
        window.location.replace(
          BASE + '/?p=' + encodeURIComponent(path) + '&q=' + encodeURIComponent(query)
        );
      }
    })();
  </script>
</head>
<body></body>
</html>
